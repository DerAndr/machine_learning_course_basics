name: Validate OKF

on:
  push:
    branches:
      - main
      - "agents/okf-*"
    paths:
      - "okf/**"
      - ".agents/skills/**"
      - "lecture_experiences/**"
      - "docs/interactive-lecture-learning-assistant.md"
      - "docs/contributing-to-textbook.md"
      - "docs/okf-authoring-guide.md"
      - "lectures/lecture_01_eda/README.md"
      - "README.md"
      - "AGENTS.md"
      - "src/mlcourse/okf_validation.py"
      - "tools/validate_okf.py"
      - "tools/build_textbook_preview.py"
      - "tests/test_okf_validation.py"
      - "tests/test_textbook_preview.py"
      - "tests/test_textbook_contribution_skill.py"
      - "tests/test_interactive_learning_assistant_docs.py"
      - "tests/test_interactive_learning_assistant_skill.py"
      - "tests/test_lecture_site_generator.py"
      - "tests/test_eda_lecture_experience.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/validate-okf.yml"
  pull_request:
    paths:
      - "okf/**"
      - ".agents/skills/**"
      - "lecture_experiences/**"
      - "docs/interactive-lecture-learning-assistant.md"
      - "docs/contributing-to-textbook.md"
      - "docs/okf-authoring-guide.md"
      - "lectures/lecture_01_eda/README.md"
      - "README.md"
      - "AGENTS.md"
      - "src/mlcourse/okf_validation.py"
      - "tools/validate_okf.py"
      - "tools/build_textbook_preview.py"
      - "tests/test_okf_validation.py"
      - "tests/test_textbook_preview.py"
      - "tests/test_textbook_contribution_skill.py"
      - "tests/test_interactive_learning_assistant_docs.py"
      - "tests/test_interactive_learning_assistant_skill.py"
      - "tests/test_lecture_site_generator.py"
      - "tests/test_eda_lecture_experience.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/validate-okf.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project environment
        run: uv sync --locked --no-default-groups --group dev

      - name: Check validator formatting and lint
        run: |
          uv run --no-sync ruff format --check src/mlcourse/okf_validation.py tools/validate_okf.py tools/build_textbook_preview.py tests/test_okf_validation.py tests/test_textbook_preview.py tests/test_textbook_contribution_skill.py tests/test_interactive_learning_assistant_docs.py tests/test_interactive_learning_assistant_skill.py tests/test_lecture_site_generator.py tests/test_eda_lecture_experience.py
          uv run --no-sync ruff check src/mlcourse/okf_validation.py tools/validate_okf.py tools/build_textbook_preview.py tests/test_okf_validation.py tests/test_textbook_preview.py tests/test_textbook_contribution_skill.py tests/test_interactive_learning_assistant_docs.py tests/test_interactive_learning_assistant_skill.py tests/test_lecture_site_generator.py tests/test_eda_lecture_experience.py

      - name: Run validator tests
        run: uv run --no-sync pytest tests/test_okf_validation.py tests/test_textbook_preview.py tests/test_textbook_contribution_skill.py tests/test_interactive_learning_assistant_docs.py tests/test_interactive_learning_assistant_skill.py tests/test_lecture_site_generator.py tests/test_eda_lecture_experience.py

      - name: Validate bundle
        run: uv run --no-sync python tools/validate_okf.py okf/
