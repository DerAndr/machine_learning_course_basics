name: Build Textbook Preview

on:
  push:
    branches:
      - main
      - "codex/okf-*"
    paths:
      - "okf/**"
      - "site/**"
      - "src/mlcourse/okf_validation.py"
      - "tools/validate_okf.py"
      - "tools/build_textbook_preview.py"
      - "tests/test_okf_validation.py"
      - "tests/test_textbook_preview.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build-textbook-preview.yml"
      - ".github/workflows/validate-okf.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project environment
        run: uv sync --locked --no-default-groups --group dev

      - name: Check formatting and lint
        run: |
          uv run --no-sync ruff format --check src/mlcourse/okf_validation.py tools/validate_okf.py tools/build_textbook_preview.py tests/test_okf_validation.py tests/test_textbook_preview.py
          uv run --no-sync ruff check src/mlcourse/okf_validation.py tools/validate_okf.py tools/build_textbook_preview.py tests/test_okf_validation.py tests/test_textbook_preview.py

      - name: Run preview tests
        run: uv run --no-sync pytest tests/test_okf_validation.py tests/test_textbook_preview.py

      - name: Build textbook preview
        run: uv run --no-sync python tools/build_textbook_preview.py

      - name: Upload textbook artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/_build

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
